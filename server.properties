# LBCore server config.
# This file is optional — if it's missing, or a key below is missing,
# the server falls back to built-in defaults and still starts.
#
# Any hosting target (home PC, Playit.gg/ngrok tunnel, Oracle/AWS/GCP
# VPS) works with bind-address left at 0.0.0.0 — that already means
# "accept connections from LAN, localhost, and the public internet at
# once." Only change it if you deliberately want to restrict access
# (e.g. 127.0.0.1 to block everything but local connections).

port=19132
bind-address=0.0.0.0
motd=LBCore Bedrock Server

# Just the world's NAME, not a path — the server always creates/opens
# it at worlds/<level-name> next to the executable (a top-level
# "worlds" folder holding every world, same convention as PocketMine
# and most other server software). Change this if you want to run a
# different or renamed world; it does NOT need to already exist — the
# folder (worlds/<level-name>/level.dat + db/) is generated
# automatically the first time the server starts if it's missing.
level-name=World
gamemode=Survival
max-players=10
protocol-version=2193
version-name=26.51

# Registers /help /list /pos /version. Set to false to send the original empty command list.
enable-commands=true
